<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Zona Libre Brunchy</title>
    <style>
      :root {
        color: #14251d;
        background: #f7f3ea;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 520px;
        padding: 48px 28px;
        text-align: center;
      }

      img {
        width: min(82vw, 360px);
        height: auto;
        border: 12px solid #ffffff;
        box-shadow: 0 20px 60px rgb(20 37 29 / 12%);
      }

      h1 {
        margin: 28px 0 8px;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #476154;
        font-size: 1rem;
      }

    </style>
  </head>
  <body>
    <main>
      <img
        src="./qr-zona-libre-brunchy.png"
        alt="Codigo QR para registro Zona Libre Brunchy"
      />
      <h1>Zona Libre Brunchy</h1>
      <p>Escanea para registrarte como miembro local verificado.</p>
    </main>
  </body>
</html>
